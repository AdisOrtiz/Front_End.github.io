<div class="cont">
    <form class="login" [formGroup]="formLogin" (ngSubmit)="login(); $event.preventDefault();"> <!--$event.preventDefault(); -> Detiene el comportamiento por defecto de un evento del navegador-->
        <h3>Iniciar Sesión</h3>
        <p>Inicie sesión ingresando su dirección de correo electrónico y contraseña.</p>
        <div class="input icons">
            <label for="user">Correo Electrónico</label>
            <i class="material-icons left">mail</i>
            <input 
            [ngClass]="{'error_input': hayError('email','required') || hayError('email','email')}" 
            type="email" id="user" class="input_form" placeholder="ejemplo@gmail.com" formControlName="email" [(ngModel)]="username">
            <div class="error" *ngIf="hayError('email','required')">*Correo Requerido</div> <!--hayError es un metodo-->
            <div class="error" *ngIf="hayError('email','email')">*Correo Invalido</div>
        </div>
        <div class="input icons">
            <label for="password">Contraseña</label>
            <i class="material-icons left">lock</i>
            <!--El input va a cambiar de tipo password a text dependiendo si mostrarPass es true(text) o false(password)-->
            <input 
            [ngClass]="{'error_input': hayError('pass','required') || hayError('pass','minlength')}"
            [type]="mostrarPass ? 'text' : 'password'"
            id="password" class="input_form" placeholder="●●●●●●●●●●●" formControlName="pass" [(ngModel)]="password">
            <!--Al dar clic en el botón, el evento se va a ejecutar y si mostrarPass es true, se muestra el icono visibility_off, sino visibility-->
            <button type="button" (click)="mostrarContrasena()" class="right">
                <span class="material-icons">
                    {{ mostrarPass ? 'visibility_off' : 'visibility' }}
                </span>
            </button>
            
            <div class="error" *ngIf="hayError('pass','required')">*Contraseña requerida</div> <!--Muestra este mensaje si se cumple el error que estoy pasando en el 2do parametro-->
            <div class="error" *ngIf="hayError('pass','minlength')">*La contraseña debe tener minimo 5 caracteres</div>

            <div *ngIf="error" class="error">{{ error }}</div>
        </div>
        <div class="boton">
            <!-- <a routerLink="homeAdmin">Aceptar</a> -->
            <button type="submit" class="btn">Aceptar</button>
        </div>
        <p class="registro">¿No tienes cuenta? <a routerLink="/reg_usuario">Regístrate Aquí</a></p>
    </form>
    
</div>
