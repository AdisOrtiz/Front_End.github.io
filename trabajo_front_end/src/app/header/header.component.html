<nav *ngIf="rolUsu === 'admin'; else clienteHeader">
    <div class="left">
        <span class="material-icons arroba">alternate_email</span>
        <h4>Biblioteca_Desarrollo_Web</h4>
    </div>
    <div class="right">
        <!-- Enlace de gestión de recursos -->
        <a routerLink="/gest_recursos" class="link_gest" (click)="cerrarMenu()">
            <span class="material-icons">add</span>Gestionar Recursos
        </a>
        <!--Icono Perfil-->
        
        <span class="material-icons perfil" id="perfil-icon" (click)="alternarMenu($event)">account_circle</span>
        <!--Menu desplegable-->
        <div class="menu" id="menu" *ngIf="menuVisible">
            <!-- Muestra el correo del usuario -->
            <div class="menu-item">{{ correoUsu }}</div>
            <!-- Muestra el rol del usuario -->
            <div class="menu-item">{{ rolUsu }}</div>
            <!-- Botón para cerrar sesión -->
            <div class="menu-item cerrar-sesion" (click)="logout()">Cerrar Sesión</div>
        </div>
    </div>
</nav>

<ng-template #clienteHeader>
    <nav>
        <div class="left">
            <span class="material-icons arroba">alternate_email</span>
            <h4>Biblioteca_Desarrollo_Web</h4>
        </div>
        <div class="right">
            <!--Icono Perfil-->
            <span class="material-icons perfil" id="perfil-icon" (click)="alternarMenu($event)">account_circle</span>
            <!--Menu desplegable-->
            <div class="menu" id="menu" *ngIf="menuVisible">
                <!-- Muestra el correo del usuario -->
                <div class="menu-item">{{ correoUsu }}</div>
                <!-- Muestra el rol del usuario -->
                <div class="menu-item">{{ rolUsu }}</div>
                <!-- Botón para cerrar sesión -->
                <div class="menu-item cerrar-sesion" (click)="logout()">Cerrar Sesión</div>
            </div>
        </div>
    </nav>
</ng-template>
